<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astonima</title>
  <meta name="description" content="One Face. Many sides of you.">
  <link rel="canonical" href="https://www.astonima.app/">
  <!-- P8-APPSHARE-01: link preview (WhatsApp, iMessage, Telegram, ...); og-image.jpg lies next to this file. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Astonima">
  <meta property="og:title" content="Astonima">
  <meta property="og:description" content="One Face. Many sides of you.">
  <meta property="og:url" content="https://www.astonima.app/">
  <meta property="og:image" content="https://www.astonima.app/og-image.jpg">
  <meta property="og:image:secure_url" content="https://www.astonima.app/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="560">
  <meta property="og:image:height" content="560">
  <meta property="og:image:alt" content="Astonima app icon">
  <meta name="twitter:card" content="summary">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    header {
      padding: 2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    /* Main Hero */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4rem 0;
    }

    .hero {
      text-align: center;
    }

    h1 {
      font-size: 2.75rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    p.lead {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-top: 2rem;
      text-align: left;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    @media (min-width: 640px) {
      .footer-content {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="brand">Astonima</div>
      <span class="badge">Coming soon</span>
    </div>
  </header>

  <main>
    <div class="container hero">
      <h1>Astonima</h1>
      <p class="lead">One Face. Many sides of you.</p>
      
      <div class="card">
        <h2>Support & Kontakt</h2>
        <p>Fragen oder Presseanfragen? Schreibe uns an: <a href="mailto:support@astonima.app" style="color: var(--accent);">support@astonima.app</a></p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 Astonima. Alle Rechte vorbehalten.</p>
      <ul class="nav-links">
        <li><a href="privacy.html">Datenschutz</a></li>
        <li><a href="terms.html">Nutzungsbedingungen</a></li>
        <li><a href="imprint.html">Impressum</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
